<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2D Yarış</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b110d;
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#eaf2ee;
    user-select:none;-webkit-user-select:none}
  #c{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;inset:0;pointer-events:none}
  .panel{position:absolute;top:12px;left:12px;background:rgba(8,16,13,.55);
    border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 14px;
    backdrop-filter:blur(6px);min-width:150px}
  .row{display:flex;justify-content:space-between;gap:14px;font-size:13px;line-height:1.65}
  .lab{color:#8fa8a0;letter-spacing:.08em;font-size:11px;font-weight:600}
  .val{font-variant-numeric:tabular-nums;font-weight:700}
  #speedWrap{position:absolute;left:14px;top:118px;background:rgba(8,16,13,.55);
    border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:6px 14px;backdrop-filter:blur(6px);
    display:flex;align-items:baseline;gap:6px}
  #speed{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .unit{font-size:11px;color:#8fa8a0;letter-spacing:.06em}
  #banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:clamp(40px,12vw,110px);font-weight:900;letter-spacing:.02em;
    text-shadow:0 6px 30px rgba(0,0,0,.7);color:#fff}
  #banner.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
  .pad{position:absolute;bottom:18px;display:none;gap:12px;pointer-events:auto}
  .pad.l{left:18px}
  .pad.r{right:18px}
  .pad button{width:74px;height:74px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
    background:rgba(20,34,28,.6);color:#dff3e8;font-size:24px;font-weight:700;
    backdrop-filter:blur(4px);touch-action:none;transition:transform .06s,background .06s}
  .pad button.on{background:rgba(90,220,160,.45);transform:scale(.94)}
  @media (hover:none) and (pointer:coarse){.pad{display:flex}}
  #over{position:absolute;inset:0;background:rgba(6,12,9,.82);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:auto;text-align:center}
  #over.show{display:flex}
  #over h1{margin:0 0 8px;font-size:clamp(24px,6vw,42px);letter-spacing:.06em}
  #over p{margin:2px;color:#a9c2b8;font-size:15px}
  #over b{color:#fff;font-variant-numeric:tabular-nums}
  #again{margin-top:16px;padding:12px 26px;border-radius:12px;border:0;font-size:15px;font-weight:700;
    background:linear-gradient(180deg,#4ade80,#22a35d);color:#062013;cursor:pointer}
  #hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;
    color:rgba(220,240,230,.5);white-space:nowrap}
  @media (hover:none) and (pointer:coarse){#hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="panel">
    <div class="row"><span class="lab">TUR</span><span class="val" id="lap">1/3</span></div>
    <div class="row"><span class="lab">SÜRE</span><span class="val" id="time">0:00.0</span></div>
    <div class="row"><span class="lab">EN İYİ</span><span class="val" id="best">--:--.-</span></div>
  </div>
  <div id="speedWrap"><span id="speed">0</span><span class="unit">km/sa</span></div>
  <div id="banner"></div>
  <div id="hint">↑ gaz · ↓ fren/geri · ← → direksiyon · P duraklat · R yeniden</div>
  <div class="pad l">
    <button data-k="left">◀</button>
    <button data-k="right">▶</button>
  </div>
  <div class="pad r">
    <button data-k="brake">▼</button>
    <button data-k="gas">▲</button>
  </div>
  <div id="over">
    <h1>YARIŞ BİTTİ</h1>
    <p>Toplam süre: <b id="fTotal">--</b></p>
    <p>En iyi tur: <b id="fBest">--</b></p>
    <button id="again">Yeniden Yarış</button>
  </div>
</div>
<script>
(function(){
'use strict';

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 1, H = 1, DPR = 1;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = cvs.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize);

const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
function rr(x,y,w,h,r){
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x,y,w,h,r);
  else {
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
}

/* ================= PİST ================= */
const CTRL = [[700,1600],[400,1150],[520,650],[1000,380],[1500,420],[1800,760],
              [2250,700],[2600,950],[2540,1450],[2150,1750],[1500,1850],[900,1950]];
const HW = 115; // pistin yarı genişliği

function buildTrack(){
  const pts = [], n = CTRL.length, SEG = 24;
  for (let i=0;i<n;i++){
    const p0 = CTRL[(i-1+n)%n], p1 = CTRL[i], p2 = CTRL[(i+1)%n], p3 = CTRL[(i+2)%n];
    for (let s=0;s<SEG;s++){
      const t = s/SEG, t2 = t*t, t3 = t2*t;
      pts.push({
        x: 0.5*((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        y: 0.5*((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      });
    }
  }
  const cum = [0]; let total = 0;
  for (let i=1;i<=pts.length;i++){
    const a = pts[i-1], b = pts[i%pts.length];
    total += Math.hypot(b.x-a.x, b.y-a.y);
    cum.push(total);
  }
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for (const p of pts){
    if (p.x<minX) minX=p.x; if (p.x>maxX) maxX=p.x;
    if (p.y<minY) minY=p.y; if (p.y>maxY) maxY=p.y;
  }
  return {pts, cum, total, bb:{x:minX,y:minY,w:maxX-minX,h:maxY-minY}};
}
const track = buildTrack();

function posAt(d){
  const T = track, len = T.pts.length;
  d = ((d % T.total) + T.total) % T.total;
  let lo = 0, hi = len;
  while (lo+1 < hi){ const m = (lo+hi)>>1; if (T.cum[m] <= d) lo = m; else hi = m; }
  const i = lo, j = (i+1) % len;
  const seg = T.cum[i+1] - T.cum[i];
  const f = seg > 1e-9 ? (d - T.cum[i]) / seg : 0;
  const a = T.pts[i], b = T.pts[j];
  return {x: a.x + (b.x-a.x)*f, y: a.y + (b.y-a.y)*f,
          ang: Math.atan2(b.y-a.y, b.x-a.x)};
}

function closest(x,y){
  const T = track, pts = T.pts, len = pts.length;
  let best = Infinity, bi = 0, bt = 0;
  for (let i=0;i<len;i++){
    const a = pts[i], b = pts[(i+1)%len];
    const ex = b.x-a.x, ey = b.y-a.y;
    const L2 = ex*ex + ey*ey;
    let t = L2 > 0 ? ((x-a.x)*ex + (y-a.y)*ey)/L2 : 0;
    t = t<0?0:(t>1?1:t);
    const px = a.x + ex*t - x, py = a.y + ey*t - y;
    const d2 = px*px + py*py;
    if (d2 < best){ best = d2; bi = i; bt = t; }
  }
  const a = pts[bi], b = pts[(bi+1)%len];
  return {d: Math.sqrt(best), prog: T.cum[bi] + (T.cum[bi+1]-T.cum[bi])*bt};
}

/* dekor */
const decor = [], patches = [];
(function(){
  const bb = track.bb;
  for (let i=0;i<460;i++){
    const x = bb.x - 260 + Math.random()*(bb.w + 520);
    const y = bb.y - 260 + Math.random()*(bb.h + 520);
    if (closest(x,y).d > HW + 72) decor.push({x,y,r:9+Math.random()*13,s:Math.random()});
  }
  for (let i=0;i<26;i++){
    patches.push({x: bb.x + Math.random()*bb.w, y: bb.y + Math.random()*bb.h,
                  rx: 220 + Math.random()*420, ry: 160 + Math.random()*320});
  }
})();

/* ================= DURUM ================= */
const COLORS = ['#e8563f','#3fa7e8','#f0b429','#8f5cf6','#38c172','#f26aa6','#6d7cff','#e2e2e2','#ff8a4c'];
const LAPS = 3;

let car, traffic, cam, state, cd, lastN, raceTime, lapStartTime, best, bestLapNo;
let lap, lapProgress, lastProg, skids, shake, bannerTimer, viewZoom, finishTime;
let skidAcc = 0;

const keys = {gas:false, brake:false, left:false, right:false};

function resetRace(){
  const p = posAt(0);
  car = {x:p.x, y:p.y, a:p.ang, v:0, steer:0, hit:0};
  cam = {x:p.x, y:p.y};
  traffic = [];
  const N = 9;
  for (let i=0;i<N;i++){
    traffic.push({
      prog: track.total*(i+0.7)/N + (Math.random()-0.5)*70,
      lane: (Math.random()<0.5?-1:1)*(HW*0.30 + Math.random()*HW*0.30),
      speed: 130 + Math.random()*150,
      color: COLORS[i % COLORS.length],
      x:0, y:0, a:0
    });
  }
  lap = 1; lapProgress = 0; lastProg = 0; best = null; bestLapNo = 0;
  raceTime = 0; lapStartTime = 0; finishTime = 0;
  skids = []; shake = 0; cd = 2.999; lastN = 4; bannerTimer = 0;
  viewZoom = 1; state = 'countdown';
  banner('');
  document.getElementById('over').classList.remove('show');
}

/* ================= GİRDİ ================= */
const keyMap = {
  ArrowUp:'gas', KeyW:'gas', Space:'brake', ArrowDown:'brake', KeyS:'brake',
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right'
};
addEventListener('keydown', e=>{
  if (keyMap[e.code]){ keys[keyMap[e.code]] = true; e.preventDefault(); }
  if (e.code === 'KeyR'){ resetRace(); e.preventDefault(); }
  if (e.code === 'KeyP'){
    if (state === 'race'){ state = 'paused'; banner('DURAKLATILDI'); }
    else if (state === 'paused'){ state = 'race'; banner(''); bannerTimer = 0; }
    e.preventDefault();
  }
});
addEventListener('keyup', e=>{
  if (keyMap[e.code]){ keys[keyMap[e.code]] = false; e.preventDefault(); }
});
addEventListener('blur', ()=>{ for (const k in keys) keys[k] = false; });

document.querySelectorAll('[data-k]').forEach(b=>{
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); };
  const off = e => { keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
});
document.getElementById('again').addEventListener('click', resetRace);

/* ================= HUD ================= */
const elLap = document.getElementById('lap'),
      elTime = document.getElementById('time'),
      elBest = document.getElementById('best'),
      elSpeed = document.getElementById('speed'),
      elBanner = document.getElementById('banner');
const cache = {};

function setText(el, txt){
  const id = el.id;
  if (cache[id] !== txt){ cache[id] = txt; el.textContent = txt; }
}
function fmt(t){
  if (t === null || t === undefined) return '--:--.-';
  const m = Math.floor(t/60), s = t - m*60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
}
function banner(txt){
  if (elBanner.textContent === txt) return;
  elBanner.textContent = txt;
  elBanner.classList.remove('pop');
  void elBanner.offsetWidth;
  if (txt) elBanner.classList.add('pop');
}

/* ================= GÜNCELLEME ================= */
function update(dt){
  if (state === 'paused') return;

  if (state === 'countdown'){
    cd -= dt;
    const n = Math.ceil(cd);
    if (n > 0 && n !== lastN){ lastN = n; banner(String(n)); }
    if (cd <= 0){
      state = 'race'; raceTime = 0; lapStartTime = 0;
      banner('BAŞLA!'); bannerTimer = 0.85;
    }
  }
  if (state === 'race') raceTime += dt;
  if (bannerTimer > 0){ bannerTimer -= dt; if (bannerTimer <= 0) banner(''); }

  const canDrive = (state === 'race');
  const ci = closest(car.x, car.y);
  const off = ci.d > HW - 6;
  const maxV = off ? 200 : 545;

  if (canDrive){
    if (keys.gas) car.v += 330*dt*(1 - clamp(Math.max(car.v,0)/maxV,0,1)*0.55);
    if (keys.brake){
      if (car.v > 5) car.v -= 900*dt;
      else car.v -= 220*dt;
    }
    car.v -= car.v*1.15*dt;
    if (off) car.v -= car.v*2.6*dt;
    car.v = clamp(car.v, -170, maxV);

    const si = (keys.right?1:0) - (keys.left?1:0);
    car.steer += (si*0.85 - car.steer)*Math.min(1, 11*dt);
    const sf = clamp(Math.abs(car.v)/150, 0, 1);
    car.a += car.steer*2.7*sf*dt*Math.sign(car.v || 1);
  } else if (state === 'finished'){
    car.v -= car.v*1.8*dt;
  }

  car.x += Math.cos(car.a)*car.v*dt;
  car.y += Math.sin(car.a)*car.v*dt;

  /* trafik */
  for (const t of traffic){
    t.prog += t.speed*dt;
    const p = posAt(t.prog);
    const nx = -Math.sin(p.ang), ny = Math.cos(p.ang);
    t.x = p.x + nx*t.lane;
    t.y = p.y + ny*t.lane;
    t.a = p.ang;
  }

  /* çarpışma */
  if (state === 'race' || state === 'finished'){
    for (const t of traffic){
      const dx = car.x - t.x, dy = car.y - t.y;
      const d = Math.hypot(dx, dy);
      const minD = 37;
      if (d < minD && d > 0.001){
        const push = (minD - d);
        car.x += dx/d * push * 0.9;
        car.y += dy/d * push * 0.9;
        car.v *= 0.62;
        car.hit = 0.28;
        shake = Math.min(13, shake + 9);
      }
    }
  }
  if (car.hit > 0) car.hit -= dt;

  /* lastik izleri */
  if (canDrive && Math.abs(car.v) > 235 && Math.abs(car.steer) > 0.5 && !off){
    skidAcc += dt;
    if (skidAcc > 0.028){
      skidAcc = 0;
      const bx = car.x - Math.cos(car.a)*16, by = car.y - Math.sin(car.a)*16;
      const nx = -Math.sin(car.a), ny = Math.cos(car.a);
      skids.push({x: bx+nx*8, y: by+ny*8, a: car.a, life: 6});
      skids.push({x: bx-nx*8, y: by-ny*8, a: car.a, life: 6});
      if (skids.length > 600) skids.splice(0, 60);
    }
  }
  for (let i = skids.length-1; i >= 0; i--){
    skids[i].life -= dt;
    if (skids[i].life <= 0) skids.splice(i,1);
  }

  /* tur sayacı */
  if (state === 'race'){
    let dp = ci.prog - lastProg;
    if (dp > track.total/2) dp -= track.total;
    else if (dp < -track.total/2) dp += track.total;
    lapProgress += dp;
    lastProg = ci.prog;

    if (lapProgress >= track.total){
      lapProgress -= track.total;
      const lt = raceTime - lapStartTime;
      if (best === null || lt < best){ best = lt; bestLapNo = lap; }
      lapStartTime = raceTime;
      lap++;
      if (lap > LAPS){
        state = 'finished'; finishTime = raceTime;
        banner('BİTTİ!'); bannerTimer = 3;
        document.getElementById('fTotal').textContent = fmt(finishTime);
        document.getElementById('fBest').textContent = fmt(best);
        document.getElementById('over').classList.add('show');
      } else {
        banner('TUR ' + lap); bannerTimer = 0.9;
      }
    }
  }

  /* kamera */
  const sp = clamp(Math.abs(car.v)/545, 0, 1);
  const zb = clamp(Math.min(W,H)/640, 0.5, 1.25);
  viewZoom += ((zb*(1 - 0.17*sp)) - viewZoom) * Math.min(1, 5*dt);
  cam.x += (car.x - cam.x) * Math.min(1, 9*dt);
  cam.y += (car.y - cam.y) * Math.min(1, 9*dt);
  shake = Math.max(0, shake - 42*dt);

  /* HUD */
  setText(elLap, Math.min(lap, LAPS) + '/' + LAPS);
  setText(elTime, fmt(raceTime));
  setText(elBest, fmt(best));
  setText(elSpeed, String(Math.round(Math.abs(car.v)*0.48)));
}

/* ================= ÇİZİM ================= */
function trackPath(){
  const p = track.pts;
  ctx.beginPath();
  ctx.moveTo(p[0].x, p[0].y);
  for (let i=1;i<p.length;i++) ctx.lineTo(p[i].x, p[i].y);
  ctx.closePath();
}

function drawStartLine(){
  const p = posAt(0), ang = p.ang;
  const nx = -Math.sin(ang), ny = Math.cos(ang);
  const cell = 16, rows = 2;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
  const n = Math.ceil(HW/cell);
  for (let r=0;r<rows;r++){
    for (let i=-n;i<n;i++){
      const off = i*cell;
      if (Math.abs(off) > HW) continue;
      ctx.fillStyle = ((i+r) & 1) ? '#f4f4f4' : '#1b2228';
      ctx.fillRect(off - cell/2, (r - 1)*cell, cell - 1, cell - 1);
    }
  }
  ctx.restore();
}

function drawCarShape(x, y, a, color, braking){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(a);
  rr(-21, -8, 46, 22, 7); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
  rr(-23, -11, 46, 22, 7); ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.stroke();
  rr(-8, -8, 14, 16, 3); ctx.fillStyle = 'rgba(18,28,42,.88)'; ctx.fill();
  rr(-19, -7, 8, 14, 3); ctx.fillStyle = 'rgba(30,45,65,.6)'; ctx.fill();
  ctx.fillStyle = '#ffefb0';
  ctx.fillRect(19, -9, 4, 5); ctx.fillRect(19, 4, 4, 5);
  ctx.fillStyle = braking ? '#ff2b2b' : 'rgba(255,60,60,.55)';
  ctx.fillRect(-23, -9, 3, 5); ctx.fillRect(-23, 4, 3, 5);
  ctx.restore();
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0e1710';
  ctx.fillRect(0, 0, W, H);

  const z = viewZoom;
  ctx.save();
  ctx.translate(W/2, H*0.66);
  ctx.rotate(-car.a - Math.PI/2);
  ctx.scale(z, z);
  ctx.translate(-cam.x + (Math.random()-0.5)*shake/z,
                -cam.y + (Math.random()-0.5)*shake/z);

  /* çim desenleri */
  for (const p of patches){
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,.017)';
    ctx.fill();
  }

  /* pist */
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  trackPath();
  ctx.strokeStyle = '#c6d2d8'; ctx.lineWidth = HW*2 + 26; ctx.stroke();
  ctx.strokeStyle = '#3a4048'; ctx.lineWidth = HW*2; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = HW*2 - 34; ctx.stroke();
  ctx.setLineDash([40, 46]);
  ctx.strokeStyle = 'rgba(255,255,255,.20)'; ctx.lineWidth = 5; ctx.stroke();
  ctx.setLineDash([]);

  drawStartLine();

  /* lastik izleri */
  for (const s of skids){
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.a);
    ctx.fillStyle = 'rgba(16,16,18,' + (0.34*Math.min(1, s.life/6)).toFixed(3) + ')';
    ctx.fillRect(-9, -4, 18, 7);
    ctx.restore();
  }

  /* ağaçlar */
  const R = 1700*1700;
  for (const d of decor){
    const dx = d.x - cam.x, dy = d.y - cam.y;
    if (dx*dx + dy*dy > R) continue;
    ctx.beginPath();
    ctx.ellipse(d.x, d.y + 4, d.r, d.r*0.7, 0, 0, 6.2832);
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fill();
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.2832);
    ctx.fillStyle = d.s < 0.5 ? '#1e3a25' : '#26482d'; ctx.fill();
    ctx.beginPath(); ctx.arc(d.x - d.r*0.25, d.y - d.r*0.3, d.r*0.55, 0, 6.2832);
    ctx.fillStyle = 'rgba(130,210,130,.13)'; ctx.fill();
  }

  /* araçlar */
  for (const t of traffic){
    const dx = t.x - cam.x, dy = t.y - cam.y;
    if (dx*dx + dy*dy > 2200*2200) continue;
    drawCarShape(t.x, t.y, t.a, t.color, false);
  }
  drawCarShape(car.x, car.y, car.a, '#f5f7fa', keys.brake && state === 'race');

  if (car.hit > 0){
    ctx.beginPath();
    ctx.arc(car.x, car.y, 34, 0, 6.2832);
    ctx.strokeStyle = 'rgba(255,80,60,' + (car.hit*2.6).toFixed(2) + ')';
    ctx.lineWidth = 4; ctx.stroke();
  }

  ctx.restore();

  /* mini harita */
  drawMinimap();
}

function drawMinimap(){
  const size = clamp(Math.min(W,H)*0.22, 82, 138);
  const pad = 12;
  const x0 = W - size - pad, y0 = pad;

  ctx.save();
  ctx.fillStyle = 'rgba(6,12,10,.55)';
  rr(x0, y0, size, size, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.5; ctx.stroke();

  const bb = track.bb, m = 15;
  const s = Math.min((size - m*2)/bb.w, (size - m*2)/bb.h);
  ctx.translate(x0 + size/2 - (bb.x + bb.w/2)*s, y0 + size/2 - (bb.y + bb.h/2)*s);
  ctx.scale(s, s);

  trackPath();
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(200,222,232,.5)';
  ctx.lineWidth = HW*0.6;
  ctx.stroke();

  for (const t of traffic){
    ctx.beginPath(); ctx.arc(t.x, t.y, HW*0.5, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(car.x, car.y, HW*0.85, 0, 6.2832);
  ctx.fillStyle = '#ff4d3d'; ctx.fill();
  ctx.restore();
}

/* ================= DÖNGÜ ================= */
let last = performance.now();
function frame(ts){
  const dt = Math.min(0.033, Math.max(0, (ts - last)/1000));
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

resize();
resetRace();
requestAnimationFrame(frame);
})();
</script>
</body>
